name: CI/CD - Madriguera Market

on:
  push:
    branches: [Dev, Qa, Prod]
  pull_request:
    branches: [Dev, Qa, Prod]

permissions:
  contents: write  # Necesario para crear Releases automáticos en prod

jobs:
  # ==========================================
  # 1. CI: Pruebas Unitarias, Cobertura y Calidad
  # ==========================================
  ci-pruebas-y-calidad:
    name: CI - Tests y Cobertura (${{ github.ref_name }})
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Requerido por Sonar para analizar historial

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar herramientas de prueba y calidad
        run: |
          python -m pip install --upgrade pip
          pip install coverage flake8
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Verificar estilo de código (Flake8)
        run: |
          # Falla solo en errores de sintaxis o variables indefinidas
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Ejecutar pruebas unitarias con cobertura
        run: |
          coverage run -m unittest discover -v
          coverage report -m --fail-under=80
          coverage xml -o coverage.xml

      - name: Subir reporte de cobertura como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ github.ref_name }}
          path: coverage.xml

      # Descomenta este bloque si conectas el repo a SonarCloud
      # - name: Escaneo de SonarCloud
      #   uses: SonarSource/sonarcloud-github-action@master
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ==========================================
  # 2. QA: Empaquetado de versión candidata
  # ==========================================
  qa-empaquetado:
    name: QA - Construir Artefacto
    needs: ci-pruebas-y-calidad
    if: github.event_name == 'push' && github.ref == 'refs/heads/Qa'
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Empaquetar aplicación (QA)
        run: |
          zip -r madriguera-market-qa.zip entities/ repositories/ services/ -x "**/__pycache__/*"

      - name: Subir artefacto de QA
        uses: actions/upload-artifact@v4
        with:
          name: madriguera-market-qa
          path: madriguera-market-qa.zip

  # ==========================================
  # 3. PROD: Despliegue / Release automático
  # ==========================================
  prod-despliegue:
    name: PROD - Publicar Release
    needs: ci-pruebas-y-calidad
    if: github.event_name == 'push' && github.ref == 'refs/heads/Prod'
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Empaquetar versión de producción
        run: |
          zip -r madriguera-market-prod.zip entities/ repositories/ services/ -x "**/__pycache__/*"

      - name: Crear GitHub Release automático
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Madriguera Market v1.0.${{ github.run_number }}"
          body: "Despliegue automático verificado desde la rama `prod`."
          files: madriguera-market-prod.zip
